# Feldkatalog: was die Rohfelder einer DTA-Datei bedeuten. Der Katalog ist kein Dokument des Herstellers; nicht jede
# Angabe ist von ihm bestätigt.
#
# Regeln:
# - `match` ordnet Rohnamen zu. `category` beschränkt auf eine DTA-Kategorie, `kind` auf eine Art.
#   `analog_factor` gilt, wenn ein Feld, das eine Firmware als Enum führt, in älteren Dateien als
#   Analogfeld steht. Der genauere Eintrag gewinnt: Kategorie und Art zählen je einmal.
# - `factor` ersetzt den Faktor aus der Datei; ohne `factor` gilt der Dateifaktor.
#   `layout_factors` gilt vor `factor` für Dateien, die auch das Rohfeld `present` führen, wenn
#   eine Firmware die Skala ändert und den Dateifaktor lässt. Die erste passende Regel gewinnt.
# - `label` nennt die Größe in Alltagssprache, Grundlage ist der Erklärtext des Handbuchs, formuliert wird
#   selbst. Ohne `label` zeigt die Oberfläche den Rohnamen. `abbr` ist das Kürzel aus der Abkürzungsliste des
#   Handbuchs (S. 70 und 71), nur wenn dessen Erklärung genau dieses Feld beschreibt.
# - `groups` gibt jeder Gruppe einen Text. `id` ist, was `group` am Eintrag nennt, benannt nach einer Kategorie
#   im Kopf der DTA-Datei; ein Eintrag kann aus einer anderen Kategorie stammen (Pumpen aus `Grundplatine EA`
#   in `Heizkreis`). Das Schema prüft, dass jede Gruppe eines Eintrags hier steht. Rohfelder ohne Eintrag
#   behalten ihre Kategorie als Gruppe.
# - `plausible`: Bereich, gegen den ein Test jeden Wert prüft; Pflicht für jeden Faktor und jeden
#   Messwert mit Einheit.
# - `no_value`: ein Wert, der „kein Wert“ heißt, nach Faktor oder Tabelle, wie er gelesen wird (nicht der Rohwert,
#   der vom Faktor des Layouts abhängt). Nur bei einem analogen Feld. Wo Werte gelesen werden, ist er NULL; in den
#   Partitionen bleibt der Rohwert.
# - `unsigned: true`: der Rohwert ist ein Zähler mit 16 Bit, den die Datei als int16 schreibt; ein negativer Rohwert
#   zählt vor dem Faktor 65.536 dazu (Python `unsigned_raw`, SQL `value_sql`). Nur bei einem analogen Feld.
# - `run_bit`: ID eines Eintrags der Art bit. Der Zähler beginnt mit jedem Lauf dieses Bits bei 0 und springt nach 65.535 s
#   auf 0; wo Werte gelesen werden, steht der Wert über den Lauf, in den Partitionen der Rohwert. Nur bei einem
#   analogen Feld mit `unsigned`; das Schema prüft, dass die ID ein Bit ist.
#   Ändert den Fingerabdruck des Katalogs nicht, es wirkt erst beim Lesen. `plausible` eines solchen Felds gilt für den
#   Rohwert ohne Vorzeichen, also vor der Korrektur über den Lauf: der Plausibilitätstest liest die Sätze einer DTA-Datei
#   je Satz, ohne Lauf. Der gelesene Wert darf über `plausible.max` liegen.
# - `options`: bei einem Enum die Übersetzung der Kopftexte aus der DTA-Datei, Kopftext → Deutsch und Englisch, `''` für
#   einen leeren Kopftext. `de` und `en` beide `null` heißt: dieser Kopftext hat keinen Text (die Ziffern 0 und 4 von
#   bivalence_stage). Ein Kopftext ohne Eintrag wird unübersetzt gezeigt.
#   `codes`: Liste Code → Kopftext für Layouts, deren Datei keine Liste führt (das Feld ist dort analog).
#   Beide ändern den Fingerabdruck des Katalogs nicht, sie wirken erst beim Lesen.
# - `unknown`: Rohfelder, deren Bedeutung offen ist. Sie werden mit Rohnamen und Dateifaktor
#   angezeigt, nie verworfen.
# - IDs sind stabil. Eine ID wird nie umgedeutet; ein neuer Sinn bekommt eine neue ID.


- id: operating_state
  kind: enum
  group: Anlagenstatus
  match:
  - name: Betr_Zust
  label:
    de: Betriebszustand
    en: operating state
  description:
    de: Was die Anlage gerade tut.
    en: What the system is doing right now.
  options:
    Heizen:
      de: Heizen
      en: heating
    BW:
      de: Warmwasser
      en: hot water
    SWB:
      de: Schwimmbad
      en: swimming pool
    EVU:
      de: EVU-Sperre
      en: utility lock
    ABT:
      de: Abtauen
      en: defrosting
    '':
      de: keine Anforderung
      en: no request
    Ext_Energ:
      de: Externe Energiequelle
      en: external energy source
    Kuhl:
      de: Kühlung
      en: cooling
  codes: [Heizen, BW, SWB, EVU, ABT, '', Ext_Energ, Kuhl]
- id: bivalence_stage
  kind: enum
  group: Anlagenstatus
  match:
  - name: Biv_Sufe
    analog_factor: 100
  - name: Bivalence
    analog_factor: 100
  label:
    de: Bivalenzstufe
    en: bivalence stage
  description:
    de: '1: ein Verdichter darf laufen, 2: zwei Verdichter, 3: dazu der zusätzliche Wärmeerzeuger.'
    en: '1: one compressor may run, 2: two compressors, 3: also the additional heat generator.'
  abbr: Biv.-Stufe
  plausible:
    min: 0
    max: 10
  options:
    '0':
      de: null
      en: null
    '1':
      de: ein Verdichter darf laufen
      en: one compressor may run
    '2':
      de: zwei Verdichter dürfen laufen
      en: two compressors may run
    '3':
      de: zusätzlicher Wärmeerzeuger darf mitlaufen
      en: additional heat generator may run
    '4':
      de: null
      en: null
  codes: ['0', '1', '2', '3', '4']

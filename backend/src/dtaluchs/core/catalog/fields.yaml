- id: defrost_end_temp
  kind: analog
  group: Anlagenstatus
  match:
  - name: AbtEndTemp
  label:
    de: Zieltemperatur Abtauende
    en: defrost end target temperature
  description:
    de: Temperatur im Verdampfer, bei der die Abtauung endet.
    en: Evaporator temperature at which defrosting ends.
  unit: °C
  plausible:
    min: 0
    max: 60
- id: controller_share_d
  kind: analog
  group: Anlagenstatus
  match:
  - name: Anteil D
- id: controller_share_i
  kind: analog

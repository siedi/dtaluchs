# Builds the image for amd64 and arm64 on a version tag and pushes it to the GitHub registry.
# The app for Home Assistant builds on the image tag named by version in its config.yaml,
# so the tag without "v" must equal the version in backend/pyproject.toml.
name: image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: version
        run: |
          v=$(awk -F'"' '/^\[/ { p = ($0 == "[project]") } p && /^version *=/ { print $2; exit }' backend/pyproject.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $v in backend/pyproject.toml"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dtaluchs" >> "$GITHUB_OUTPUT"

      # The frontend stage runs on the build platform; only the Python stages need emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
